    <!-- Prevent Flash of Incorrect Theme Script -->
    <script>
      (function() {
        try {
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var saved = localStorage.getItem('preetom_theme_mode') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && mql.matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-theme-page text-theme-main antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
